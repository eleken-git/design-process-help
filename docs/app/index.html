    <style>
      /* Спільне меню сайту design-process-help — лише на опублікованому прев'ю (docs/app/), не заважає локальній розробці.
         Та сама розмітка, що на сторінках docs/, кольори GitHub Dark вписані напряму, бо в оболонці немає токенів сторінки. */
      #hub-nav{display:none;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;height:52px;padding:0 20px;background:#0D1117;border-bottom:1px solid #21262D;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif}
      #hub-nav.on{display:grid}
      #hub-nav .site-logo{justify-self:start;display:inline-flex;align-items:center;gap:8px;min-width:0;color:#E6EDF3;font:600 13px ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;text-decoration:none;white-space:nowrap}
      #hub-nav .site-mark{flex:none;display:grid;place-items:center;width:24px;height:24px;border-radius:6px;background:#E6EDF3;color:#0D1117;font:700 14px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      #hub-nav nav{display:flex;gap:2px;max-width:100%;padding:3px;overflow-x:auto;scrollbar-width:none;border:1px solid #30363D;border-radius:10px;background:#161B22}
      #hub-nav nav a{flex:none;display:inline-flex;align-items:center;height:32px;padding:0 14px;border-radius:7px;color:#8B949E;font:500 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;white-space:nowrap;text-decoration:none}
      #hub-nav nav a:hover{color:#E6EDF3;background:rgba(110,118,129,.14)}
      #hub-nav nav a[aria-current="page"]{background:#1C2128;color:#E6EDF3;box-shadow:inset 0 0 0 1px #30363D}
      #hub-nav a:focus-visible{outline:2px solid #58A6FF;outline-offset:2px}
      #hub-nav .site-gh{justify-self:end;display:grid;place-items:center;width:32px;height:32px;border-radius:8px;color:#8B949E}
      #hub-nav .site-gh:hover{color:#E6EDF3;background:rgba(110,118,129,.14)}
      #hub-nav .site-gh svg{width:18px;height:18px;fill:currentColor}
      @media (max-width:640px){
        #hub-nav{grid-template-columns:auto minmax(0,1fr);padding:0 12px}
        #hub-nav .site-name,#hub-nav .site-gh{display:none}
        #hub-nav nav{justify-self:end}
        #hub-nav nav a{padding:0 9px}
      }
    </style>
